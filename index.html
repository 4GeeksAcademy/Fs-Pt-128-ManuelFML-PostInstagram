<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Instagram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="post">
        <div class="header">
            <div class="header-left">
                <div>
                    <i class="fa-brands fa-html5 iconos"></i>
                </div>
                <div>
                    <p><strong>HTML5</strong></p>
                    <p>Manuel</p>
                </div>
            </div>
            <div class="header-right">
                <i class="fa-solid fa-ellipsis-vertical iconos"></i>
            </div>
        </div>

        <div class="imag">
            <img src="https://cdn.pixabay.com/photo/2016/07/30/21/37/mario-1558062_1280.jpg" alt="">
        </div>

        <div class="footer">
            <div class="logos">

                    <i class="fa-regular fa-paper-plane iconos"></i>
                </div>
                <div class="logos-right">
                    <i class="fa-regular fa-bookmark iconos"></i>

            </div>

                <br>
                <p>Liked by <strong>4Gueeks Academy, HTML5, Web </strong>and <strong>100,000 other</strong></p>
                <br>
                <br>
                <p>Esta publicación va dedicada a <strong><em>@Javier Pestana</em></strong> y espero 
                   que le guste tanto como tantos me gustas tiene la publicación.

            </div>
        </div>
    </div>
